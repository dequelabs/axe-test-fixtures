<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Include/Exclude Fixture</title>
  </head>
  <body>
    <div class="include">
      include me
      <img src="includeOne.jpg" />
      <div class="exclude">
        exclude me
        <img src="excludeOne.jpg" />
      </div>
    </div>

    <div class="include2">
      include me two
      <img src="includeTwo.jpg" />
      <div class="exclude2">
        exclude me two
        <img src="excludeTwo.jpg" />
      </div>
    </div>
  </body>
</html>
